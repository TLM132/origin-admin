<!DOCTYPE html>
<html>
<head>
    <title>Origin Admin</title>
    <meta charset="UTF-8">
    <style>
        :root {
            --bg: #020617;
            --card: #0f172a;
            --border: #1e293b;
            --accent: #3b82f6;
            --accent2: #2563eb;
            --text: #e5e7eb;
            --muted: #94a3b8;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, sans-serif;
            overflow-x: hidden;
        }

        header {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 16px 24px;
            background: rgba(2,6,23,0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 50;
        }

        header h1 {
            margin: 0;
            font-size: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        header h1::before {
            content: "";
            width: 18px;
            height: 18px;
            border-radius: 999px;
            background: radial-gradient(circle, var(--accent), var(--accent2));
            box-shadow: 0 0 18px rgba(59,130,246,0.7);
        }

        #statusText {
            font-size: 13px;
            padding: 6px 10px;
            border-radius: 999px;
            background: rgba(15,23,42,0.8);
            border: 1px solid rgba(148,163,184,0.4);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        #statusDot {
            width: 8px;
            height: 8px;
            border-radius: 999px;
            background: #f97316;
        }

        /* Layout */
        .layout {
            display: flex;
            margin-top: 70px;
        }

        .sidebar {
            width: 230px;
            position: fixed;
            top: 80px;
            left: 0;
            padding: 20px;
            height: calc(100vh - 80px);
        }

        .sidebar-title {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--muted);
            margin-bottom: 8px;
        }

        .sidebar button {
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: rgba(15,23,42,0.9);
            color: var(--text);
            cursor: pointer;
            font-size: 14px;
            text-align: left;
            transition: all 0.18s ease-out;
        }

        .sidebar button.active {
            background: linear-gradient(135deg, var(--accent2), var(--accent));
            border-color: transparent;
            box-shadow: 0 10px 25px rgba(37,99,235,0.35);
        }

        .content {
            margin-left: 260px;
            width: calc(100% - 260px);
        }

        .sections {
            scroll-snap-type: y mandatory;
            height: calc(100vh - 70px);
            overflow-y: scroll;
        }

        .section {
            height: 90vh;
            padding: 40px;
            scroll-snap-align: start;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .card {
            width: 90%;
            background: var(--card);
            border-radius: 16px;
            padding: 24px;
            border: 1px solid var(--border);
            box-shadow: 0 18px 40px rgba(0,0,0,0.4);
        }

        .glow-line {
            height: 1px;
            width: 100%;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
            opacity: 0.6;
            margin: 12px 0 20px;
        }

        label {
            display: block;
            margin-top: 12px;
            font-size: 14px;
            color: var(--muted);
        }

        select, input {
            margin-top: 6px;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: #0f172a;
            color: var(--text);
            width: 100%;
            font-size: 14px;
        }

        button.action {
            margin-top: 16px;
            padding: 12px 18px;
            border-radius: 999px;
            border: none;
            background: linear-gradient(135deg, var(--accent2), var(--accent));
            color: white;
            cursor: pointer;
            font-size: 14px;
            box-shadow: 0 12px 30px rgba(37,99,235,0.45);
        }

        .pill {
            display: inline-flex;
            padding: 6px 12px;
            border-radius: 999px;
            background: #1e293b;
            border: 1px solid var(--border);
            margin: 4px;
            font-size: 13px;
        }

        #logsContainer {
            max-height: 60vh;
            overflow-y: auto;
        }

        .log-entry {
            background: #1e293b;
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 8px;
            border: 1px solid var(--border);
            font-size: 13px;
        }
    </style>
</head>
<body>

<header>
    <h1>Origin Admin</h1>
    <span id="statusText">
        <span id="statusDot"></span>
        <span id="statusLabel">Connecting...</span>
    </span>
</header>

<div class="layout">
    <div class="sidebar">
        <div class="sidebar-title">Sections</div>
        <button id="btn-antiRaid">Anti-Raid ⚡</button>
        <button id="btn-tickets">Tickets 🎫</button>
        <button id="btn-staff">Staff Points 👤</button>
        <button id="btn-logs">Logs 📜</button>
    </div>

    <div class="content">
        <div class="sections">

            <!-- Anti-Raid -->
            <div id="section-antiRaid" class="section">
                <div class="card">
                    <h2>Anti-Raid Settings</h2>
                    <div class="glow-line"></div>

                    <label>Auto Kick Unauthorized Bots</label>
                    <select id="autoKickUnauthorizedBots">
                        <option value="true">Enabled</option>
                        <option value="false">Disabled</option>
                    </select>

                    <label>Log Unauthorized Bot Add</label>
                    <select id="logUnauthorizedBotAdd">
                        <option value="true">Enabled</option>
                        <option value="false">Disabled</option>
                    </select>

                    <label>Allowed Bot Adders</label>
                    <select id="memberSelect"></select>
                    <button class="action" onclick="addAllowedBotAdder()">Add</button>

                    <div id="allowedBotAddersList"></div>

                    <button class="action" onclick="saveAntiRaid()">Save Anti-Raid</button>
                </div>
            </div>

            <!-- Tickets -->
            <div id="section-tickets" class="section">
                <div class="card">
                    <h2>Ticket Panel</h2>
                    <div class="glow-line"></div>

                    <label>Panel Name</label>
                    <input id="ticketPanelName">

                    <label>Panel Description</label>
                    <input id="ticketPanelDescription">

                    <label>Ticket Category</label>
                    <select id="ticketCategorySelect"></select>

                    <label>Panel Channel</label>
                    <select id="ticketPanelChannelSelect"></select>

                    <label>Max Tickets Per User</label>
                    <input id="ticketMaxPerUser" type="number">

                    <label>Ping Role</label>
                    <select id="ticketPingRoleSelect"></select>

                    <button class="action" onclick="saveTickets()">Save Ticket Settings</button>
                    <button class="action" onclick="deployTicketPanel()">Deploy Panel</button>
                </div>
            </div>

            <!-- Staff Points -->
            <div id="section-staff" class="section">
                <div class="card">
                    <h2>Staff Points</h2>
                    <div class="glow-line"></div>

                    <label>Staff Role</label>
                    <select id="staffRoleSelect"></select>

                    <label>Required Points</label>
                    <input id="requiredPointsInput" type="number">

                    <label>Add Points</label>
                    <select id="staffMemberSelect"></select>
                    <input id="staffPointsToAdd" type="number">
                    <button class="action" onclick="addStaffPoints()">Add Points</button>

                    <div id="staffPointsList"></div>

                    <button class="action" onclick="saveStaffSettings()">Save Staff Settings</button>
                </div>
            </div>

            <!-- Logs -->
            <div id="section-logs" class="section">
                <div class="card">
                    <h2>Logs</h2>
                    <div class="glow-line"></div>
                    <div id="logsContainer"></div>
                </div>
            </div>

        </div>
    </div>
</div>

<script>
let config = null;
let members = [];
let roles = [];
let channels = [];
let logs = [];

function logEvent(text) {
    logs.push({ time: new Date().toLocaleString(), text });
    renderLogs();
}

function renderLogs() {
    const container = document.getElementById("logsContainer");
    container.innerHTML = "";
    logs.slice().reverse().forEach(log => {
        const div = document.createElement("div");
        div.className = "log-entry";
        div.textContent = `[${log.time}] ${log.text}`;
        container.appendChild(div);
    });
}

function highlightSidebar(sectionId) {
    document.querySelectorAll(".sidebar button").forEach(btn => btn.classList.remove("active"));
    document.getElementById("btn-" + sectionId).classList.add("active");
}

document.querySelector(".sections").addEventListener("scroll", () => {
    const sections = ["antiRaid", "tickets", "staff", "logs"];
    let closest = null;
    let closestDist = Infinity;

    sections.forEach(id => {
        const el = document.getElementById("section-" + id);
        const rect = el.getBoundingClientRect();
        const dist = Math.abs(rect.top - 70);
        if (dist < closestDist) {
            closestDist = dist;
            closest = id;
        }
    });

    highlightSidebar(closest);
});

function setStatus(connected) {
    const dot = document.getElementById("statusDot");
    const label = document.getElementById("statusLabel");
    if (connected) {
        dot.style.background = "#22c55e";
        label.textContent = "Connected";
    } else {
        dot.style.background = "#f97316";
        label.textContent = "Connecting...";
    }
}

async function loadAll() {
    try {
        setStatus(false);

        config = await (await fetch("/api/config")).json();
        members = await (await fetch("/api/members")).json();
        roles = await (await fetch("/api/roles")).json();
        channels = await (await fetch("/api/channels")).json();

        populateAntiRaid();
        populateTickets();
        populateStaff();
        renderLogs();

        setStatus(true);
        logEvent("Dashboard connected.");
    } catch (e) {
        console.error(e);
        logEvent("Failed to load dashboard.");
    }
}

function populateAntiRaid() {
    document.getElementById("autoKickUnauthorizedBots").value =
        String(config.antiRaid.autoKickUnauthorizedBots);

    document.getElementById("logUnauthorizedBotAdd").value =
        String(config.antiRaid.logUnauthorizedBotAdd);

    const memberSelect = document.getElementById("memberSelect");
    memberSelect.innerHTML = "";
    members.forEach(m => {
        const opt = document.createElement("option");
        opt.value = m.id;
        opt.textContent = `${m.username} (${m.tag})`;
        memberSelect.appendChild(opt);
    });

    renderAllowedBotAdders();
}

function renderAllowedBotAdders() {
    const container = document.getElementById("allowedBotAddersList");
    container.innerHTML = "";

    config.antiRaid.allowedBotAdders.forEach(id => {
        const member = members.find(m => m.id === id);
        const pill = document.createElement("span");
        pill.className = "pill";
        pill.textContent = member ? `${member.username} (${member.tag})` : id;
        container.appendChild(pill);
    });
}

function addAllowedBotAdder() {
    const id = document.getElementById("memberSelect").value;
    if (!config.antiRaid.allowedBotAdders.includes(id)) {
        config.antiRaid.allowedBotAdders.push(id);
        renderAllowedBotAdders();
        logEvent(`Added allowed bot adder: ${id}`);
    }
}

async function saveAntiRaid() {
    config.antiRaid.autoKickUnauthorizedBots =
        document.getElementById("autoKickUnauthorizedBots").value === "true";

    config.antiRaid.logUnauthorizedBotAdd =
        document.getElementById("logUnauthorizedBotAdd").value === "true";

    await fetch("/api/save", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(config)
    });

    logEvent("Anti-Raid settings saved.");
}

function populateTickets() {
    document.getElementById("ticketPanelName").value = config.tickets.panelName;
    document.getElementById("ticketPanelDescription").value = config.tickets.panelDescription;
    document.getElementById("ticketMaxPerUser").value = config.tickets.maxPerUser;

    const catSelect = document.getElementById("ticketCategorySelect");
    const panelSelect = document.getElementById("ticketPanelChannelSelect");

    catSelect.innerHTML = "";
    panelSelect.innerHTML = "";

    channels.forEach(c => {
        const opt = document.createElement("option");
        opt.value = c.id;
        opt.textContent = c.name;
        catSelect.appendChild(opt);

        const opt2 = document.createElement("option");
        opt2.value = c.id;
        opt2.textContent = c.name;
        panelSelect.appendChild(opt2);
    });

    catSelect.value = config.tickets.categoryId;
    panelSelect.value = config.tickets.panelChannelId;

    const pingRoleSelect = document.getElementById("ticketPingRoleSelect");
    pingRoleSelect.innerHTML = "";
    roles.forEach(r => {
        const opt = document.createElement("option");
        opt.value = r.id;
        opt.textContent = r.name;
        pingRoleSelect.appendChild(opt);
    });

    pingRoleSelect.value = config.tickets.pingRoleId;
}

async function saveTickets() {
    config.tickets.panelName = document.getElementById("ticketPanelName").value;
    config.tickets.panelDescription = document.getElementById("ticketPanelDescription").value;
    config.tickets.categoryId = document.getElementById("ticketCategorySelect").value;
    config.tickets.panelChannelId = document.getElementById("ticketPanelChannelSelect").value;
    config.tickets.maxPerUser = Number(document.getElementById("ticketMaxPerUser").value);
    config.tickets.pingRoleId = document.getElementById("ticketPingRoleSelect").value;

    await fetch("/api/save", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(config)
    });

    logEvent("Ticket settings saved.");
}

async function deployTicketPanel() {
    const res = await fetch("/api/deployTicketPanel", { method: "POST" });
    const data = await res.json();

    if (data.status === "deployed") {
        logEvent("Ticket panel deployed.");
    } else {
        logEvent("Failed to deploy ticket panel.");
    }
}

function populateStaff() {
    const staffRoleSelect = document.getElementById("staffRoleSelect");
    staffRoleSelect.innerHTML = "";
    roles.forEach(r => {
        const opt = document.createElement("option");
        opt.value = r.id;
        opt.textContent = r.name;
        staffRoleSelect.appendChild(opt);
    });
    staffRoleSelect.value = config.staffPoints.staffRoleId;

    document.getElementById("requiredPointsInput").value =
        config.staffPoints.requiredPoints;

    const staffMemberSelect = document.getElementById("staffMemberSelect");
    staffMemberSelect.innerHTML = "";
    members.forEach(m => {
        const opt = document.createElement("option");
        opt.value = m.id;
        opt.textContent = `${m.username} (${m.tag})`;
        staffMemberSelect.appendChild(opt);
    });

    renderStaffPoints();
}

function renderStaffPoints() {
    const container = document.getElementById("staffPointsList");
    container.innerHTML = "";

    const map = config.staffPoints.members || {};

    Object.keys(map).forEach(id => {
        const member = members.find(m => m.id === id);
        const pill = document.createElement("span");
        pill.className = "pill";
        pill.textContent = `${member ? member.username : id}: ${map[id]} pts`;
        container.appendChild(pill);
    });
}

async function addStaffPoints() {
    const userId = document.getElementById("staffMemberSelect").value;
    const points = Number(document.getElementById("staffPointsToAdd").value);

    if (!userId || points <= 0) return;

    const res = await fetch("/api/addStaffPoints", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ userId, points })
    });

    const data = await res.json();

    if (!config.staffPoints.members)
        config.staffPoints.members = {};

    config.staffPoints.members[userId] = data.total;

    renderStaffPoints();
    logEvent(`Added ${points} points to ${userId}.`);
}
